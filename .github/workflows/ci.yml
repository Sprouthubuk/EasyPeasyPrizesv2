name: CI
on:
  # Every PR gets a run. Pushes only run on the integration branch (where PRs merge) and main;
  # a push to a branch with an open PR is already covered by its pull_request run.
  # Docs-only changes skip CI.
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [feat/foundation, main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fixed Composer cache location so actions/cache below can save and restore it.
env:
  COMPOSER_CACHE_DIR: /home/runner/.cache/composer

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: easypeasy_test }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "gmp, intl, bcmath, pdo_mysql, pdo_sqlite", coverage: none }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
        env:
          # A GitHub token that can read Sprouthubuk/verity-engine: {"github-oauth":{"github.com":"<token>"}}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      # Verity's integrity guards are triggers: MySQL must let this user create them.
      - run: mysql -h127.0.0.1 -uroot -proot -e "SET PERSIST log_bin_trust_function_creators = 1"
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests on MySQL (as production)
        run: php artisan test
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_DATABASE: easypeasy_test, DB_USERNAME: root, DB_PASSWORD: root }
      - name: Tests on SQLite
        run: php artisan test

  fullstack:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "gmp, intl, bcmath, pdo_sqlite", coverage: none }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: composer install --no-interaction --prefer-dist && cp .env.example .env && php artisan key:generate
        working-directory: backend
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - run: npm ci && npm run build && npm run test:fullstack
        working-directory: frontend
      # Every page at 320/390/820/1440px: console errors, sideways scroll, broken pictures, words run together.
      - run: npm run test:visual
        working-directory: frontend
        env: { CHROME_PATH: /usr/bin/google-chrome, SHOTS_DIR: "${{ runner.temp }}/shots" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: "${{ runner.temp }}/shots", retention-days: 3 }
